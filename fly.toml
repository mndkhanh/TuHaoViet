# fly.toml app configuration file generated for vietfamily on 2026-06-29T04:10:08Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vietfamily'
primary_region = 'ams'

[build]

[env]
  # Participant data lives on the mounted volume, not in the ephemeral container
  # filesystem, so scores survive restarts / scale-to-zero.
  DATA_DIR = '/data'

# Persistent storage for participants.json.
# Create once before deploying:  fly volumes create vietfamily_data --size 1 --region ams
[mounts]
  source = 'vietfamily_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
