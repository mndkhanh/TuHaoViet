# fly.toml app configuration file generated for tuhaoviet on 2026-10-28T17:19:26Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tuhaoviet'
primary_region = 'ams'

[build]

[env]
  DATA_DIR = '/data'

[[mounts]]
  source = 'vietfamily_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
