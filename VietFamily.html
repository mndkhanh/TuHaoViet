  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

t-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"5c817fcd-b8b2-4192-acc6-fed9fe430d01\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"233fcbf1-61d3-4b63-b151-c3387c2d2984\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n  <style>/* ============================================================\n   Searchify — Color tokens\n   Brand palette: #CEAA28 (gold) · #AEA82F (olive) · #EEFFDB (mint) · #FFFFFF\n   Warm, organic, premium. Gold is the hero; mint is the soft surface;\n   ink is a warm green-tinted near-black.\n   ============================================================ */\n\n:root {\n  /* ---- Brand: Gold (hero) ---- */\n  --gold-50:  #FBF6E3;\n  --gold-100: #F6EBBE;\n  --gold-200: #EDD986;\n  --gold-300: #E2C552;\n  --gold-400: #D6B539;\n  --gold-500: #CEAA28; /* brand gold */\n  --gold-600: #AE8C1E;\n  --gold-700: #876C17;\n  --gold-800: #614E12;\n  --gold-900: #3F330B;\n\n  /* ---- Brand: Olive (secondary accent) ---- */\n  --olive-100: #EFEFCD;\n  --olive-200: #DBDB97;\n  --olive-300: #C7C566;\n  --olive-400: #B8B43F;\n  --olive-500: #AEA82F; /* brand olive */\n  --olive-600: #8C8825;\n  --olive-700: #67651B;\n\n  /* ---- Brand: Mint (soft surface) ---- */\n  --mint-50:  #F6FFEE;\n  --mint-100: #EEFFDB; /* brand mint surface */\n  --mint-200: #DCF4C2;\n  --mint-300: #C4E59E;\n\n  /* ---- Ink: warm green-tinted neutral ramp ---- */\n  --ink-900: #16170F; /* near black */\n  --ink-800: #24261A;\n  --ink-700: #393B2C;\n  --ink-600: #565943;\n  --ink-500: #757862;\n  --ink-400: #9A9C86;\n  --ink-300: #C2C3B0;\n  --ink-200: #E1E2D5;\n  --ink-100: #EFEFE7;\n  --ink-50:  #F8F8F2;\n  --white:   #FFFFFF;\n\n  /* ---- Status (harmonized warm/organic) ---- */\n  --success-100: #DCEFDF;\n  --success-500: #2E7D4F;\n  --success-700: #1E5736;\n  --warning-100: #F9EEC4;\n  --warning-500: #C9971A;\n  --warning-700: #8A6710;\n  --danger-100:  #F6DDD3;\n  --danger-500:  #C0492F;\n  --danger-700:  #8A3320;\n  --info-100:    #D5EBE9;\n  --info-500:    #2B6E6A;\n  --info-700:    #1C4B48;\n\n  /* ============================================================\n     SEMANTIC ALIASES — reference these in product UI\n     ============================================================ */\n\n  /* Backgrounds & surfaces */\n  --bg-page:        var(--mint-50);\n  --bg-page-alt:    var(--white);\n  --surface:        var(--white);\n  --surface-muted:  var(--ink-50);\n  --surface-mint:   var(--mint-100);\n  --surface-ink:    var(--ink-900);\n  --surface-inset:  var(--ink-100);\n\n  /* Text */\n  --text-strong:    var(--ink-900);\n  --text-body:      var(--ink-800);\n  --text-muted:     var(--ink-600);\n  --text-subtle:    var(--ink-500);\n  --text-on-brand:  var(--ink-900);  /* gold is light → dark text */\n  --text-on-ink:    var(--mint-50);\n  --text-inverse:   var(--white);\n\n  /* Brand roles */\n  --brand:          var(--gold-500);\n  --brand-hover:    var(--gold-400);\n  --brand-press:    var(--gold-600);\n  --brand-strong:   var(--gold-700);\n  --brand-subtle:   var(--gold-100);\n  --accent:         var(--olive-500);\n  --accent-strong:  var(--olive-700);\n\n  /* Borders & lines */\n  --border-subtle:  var(--ink-200);\n  --border-default: var(--ink-300);\n  --border-strong:  var(--ink-400);\n  --border-brand:   var(--gold-500);\n  --border-onink:   rgba(238, 255, 219, 0.14);\n\n  /* Focus ring */\n  --focus-ring:     var(--gold-500);\n  --focus-ring-offset: var(--white);\n\n  /* Selection */\n  --select-bg:      var(--gold-200);\n  --select-fg:      var(--ink-900);\n}\n\n::selection { background: var(--select-bg); color: var(--select-fg); }\n<\u002Fstyle>\n  <style>/* ============================================================\n   Searchify — Typography tokens\n   Display: Bricolage Grotesque · Body: Hanken Grotesk · Mono: JetBrains Mono\n   Type scale is a major-third-ish ramp tuned for marketing + product.\n   ============================================================ */\n\n:root {\n  /* ---- Families ---- */\n  --font-display: 'Bricolage Grotesque', 'Hanken Grotesk', system-ui, sans-serif;\n  --font-sans:    'Hanken Grotesk', system-ui, -apple-system, sans-serif;\n  --font-mono:    'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;\n\n  /* ---- Weights ---- */\n  --fw-regular:  400; /* @kind font */\n  --fw-medium:   500; /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold:     700; /* @kind font */\n  --fw-extra:    800; /* @kind font */\n\n  /* ---- Font sizes (rem-based, 16px root) ---- */\n  --text-2xs:  0.6875rem;  /* 11px */\n  --text-xs:   0.75rem;    /* 12px */\n  --text-sm:   0.875rem;   /* 14px */\n  --text-base: 1rem;       /* 16px */\n  --text-md:   1.125rem;   /* 18px */\n  --text-lg:   1.375rem;   /* 22px */\n  --text-xl:   1.75rem;    /* 28px */\n  --text-2xl:  2.25rem;    /* 36px */\n  --text-3xl:  3rem;       /* 48px */\n  --text-4xl:  4rem;       /* 64px */\n  --text-5xl:  5.25rem;    /* 84px */\n\n  /* ---- Line heights ---- */\n  --leading-tight:   1.04;\n  --leading-snug:    1.16;\n  --leading-normal:  1.5;\n  --leading-relaxed: 1.65;\n\n  /* ---- Letter spacing ---- */\n  --tracking-tight:  -0.03em;\n  --tracking-snug:   -0.015em;\n  --tracking-normal: 0;\n  --tracking-wide:   0.04em;\n  --tracking-caps:   0.12em;  /* eyebrow / overline */\n\n  /* ---- Semantic roles ---- */\n  --display-font:    var(--font-display);\n  --display-weight:  var(--fw-extra);\n  --display-tracking: var(--tracking-tight);\n\n  --heading-font:    var(--font-display);\n  --heading-weight:  var(--fw-bold);\n\n  --body-font:       var(--font-sans);\n  --body-weight:     var(--fw-regular);\n  --body-leading:    var(--leading-relaxed);\n\n  --eyebrow-font:    var(--font-mono);\n  --eyebrow-weight:  var(--fw-medium);\n  --eyebrow-size:    var(--text-xs);\n  --eyebrow-tracking: var(--tracking-caps);\n}\n\n/* Convenience utility classes (optional; tokens are the source of truth) */\n.ds-display {\n  font-family: var(--display-font);\n  font-weight: var(--display-weight);\n  letter-spacing: var(--display-tracking);\n  line-height: var(--leading-tight);\n}\n.ds-eyebrow {\n  font-family: var(--eyebrow-font);\n  font-weight: var(--eyebrow-weight);\n  font-size: var(--eyebrow-size);\n  letter-spacing: var(--eyebrow-tracking);\n  text-transform: uppercase;\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   Searchify — Spacing & layout tokens\n   8px base grid with a couple of half-steps for fine control.\n   ============================================================ */\n\n:root {\n  /* ---- Spacing scale (8px grid) ---- */\n  --space-0:   0;\n  --space-1:   0.25rem;  /* 4 */\n  --space-2:   0.5rem;   /* 8 */\n  --space-3:   0.75rem;  /* 12 */\n  --space-4:   1rem;     /* 16 */\n  --space-5:   1.5rem;   /* 24 */\n  --space-6:   2rem;     /* 32 */\n  --space-7:   3rem;     /* 48 */\n  --space-8:   4rem;     /* 64 */\n  --space-9:   6rem;     /* 96 */\n  --space-10:  8rem;     /* 128 */\n\n  /* ---- Container widths ---- */\n  --container-sm:  640px;\n  --container-md:  840px;\n  --container-lg:  1080px;\n  --container-xl:  1280px;\n  --container-2xl: 1440px;\n\n  /* ---- Section rhythm ---- */\n  --section-pad-y:    var(--space-9);\n  --gutter:           var(--space-5);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   Searchify — Effects: radii, shadows, borders, motion\n   Soft, slightly oversized radii + warm-tinted shadows.\n   ============================================================ */\n\n:root {\n  /* ---- Corner radii ---- */\n  --radius-xs:   4px;\n  --radius-sm:   8px;\n  --radius-md:   12px;\n  --radius-lg:   18px;\n  --radius-xl:   26px;\n  --radius-2xl:  36px;\n  --radius-pill: 999px;\n\n  /* ---- Border widths ---- */\n  --border-1: 1px; /* @kind other */\n  --border-2: 2px; /* @kind other */\n\n  /* ---- Shadows: warm-tinted, soft, layered ---- */\n  --shadow-xs:  0 1px 2px rgba(22, 23, 15, 0.06);\n  --shadow-sm:  0 2px 6px rgba(22, 23, 15, 0.07);\n  --shadow-md:  0 8px 24px -8px rgba(22, 23, 15, 0.14);\n  --shadow-lg:  0 20px 48px -16px rgba(22, 23, 15, 0.20);\n  --shadow-xl:  0 36px 80px -28px rgba(22, 23, 15, 0.28);\n\n  /* Gold-tinted glow for hero/brand emphasis */\n  --shadow-brand: 0 18px 48px -16px rgba(206, 170, 40, 0.45);\n\n  /* Inset for inputs / wells */\n  --shadow-inset: inset 0 1px 2px rgba(22, 23, 15, 0.06);\n\n  /* ---- Motion ---- */\n  --ease-out:    cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */\n  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1); /* @kind other */\n  --dur-fast:   120ms; /* @kind other */\n  --dur-base:   220ms; /* @kind other */\n  --dur-slow:   420ms; /* @kind other */\n\n  /* ---- Z-index scale ---- */\n  --z-base:    0;    /* @kind other */\n  --z-raised:  10;   /* @kind other */\n  --z-sticky:  100;  /* @kind other */\n  --z-overlay: 1000; /* @kind other */\n  --z-toast:   1100; /* @kind other */\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   Searchify — Base element defaults\n   Applies tokens to raw elements so consumers get sane defaults.\n   ============================================================ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font-family: var(--body-font);\n  font-weight: var(--body-weight);\n  font-size: var(- tte: #CEAA28 (gold) · #AEA82F (olive) · #EEFFDB (mint) · #FFFFFF\n   Warm, organic, premium. Gold is the hero; mint is the soft surface;\n   ink is a warm green-tinted near-black.\n   ============================================================ */\n\n:root {\n  /* ---- Brand: Gold (hero) ---- */\n  --gold-50:  #FBF6E3;\n  --gold-100: #F6EBBE;\n  --gold-200: #EDD986;\n  --gold-300: #E2C552;\n  --gold-400: #D6B539;\n  --gold-500: #CEAA28; /* brand gold */\n  --gold-600: #AE8C1E;\n  --gold-700: #876C17;\n  --gold-800: #614E12;\n  --gold-900: #3F330B;\n\n  /* ---- Brand: Olive (secondary accent) ---- */\n  --olive-100: #EFEFCD;\n  --olive-200: #DBDB97;\n  --olive-300: #C7C566;\n  --olive-400: #B8B43F;\n  --olive-500: #AEA82F; /* brand olive */\n  --olive-600: #8C8825;\n  --olive-700: #67651B;\n\n  /* ---- Brand: Mint (soft surface) ---- */\n  --mint-50:  #F6FFEE;\n  --mint-100: #EEFFDB; /* brand mint surface */\n  --mint-200: #DCF4C2;\n  --mint-300: #C4E59E;\n\n  /* ---- Ink: warm green-tinted neutral ramp ---- */\n  --ink-900: #16170F; /* near black */\n  --ink-800: #24261A;\n  --ink-700: #393B2C;\n  --ink-600: #565943;\n  --ink-500: #757862;\n  --ink-400: #9A9C86;\n  --ink-300: #C2C3B0;\n  --ink-200: #E1E2D5;\n  --ink-100: #EFEFE7;\n  --ink-50:  #F8F8F2;\n  --white:   #FFFFFF;\n\n  /* ---- Status (harmonized warm/organic) ---- */\n  --success-100: #DCEFDF;\n  --success-500: #2E7D4F;\n  --success-700: #1E5736;\n  --warning-100: #F9EEC4;\n  --warning-500: #C9971A;\n  --warning-700: #8A6710;\n  --danger-100:  #F6DDD3;\n  --danger-500:  #C0492F;\n  --danger-700:  #8A3320;\n  --info-100:    #D5EBE9;\n  --info-500:    #2B6E6A;\n  --info-700:    #1C4B48;\n\n  /* ============================================================\n     SEMANTIC ALIASES — reference these in product UI\n     ============================================================ */\n\n  /* Backgrounds & surfaces */\n  --bg-page:        var(--mint-50);\n  --bg-page-alt:    var(--white);\n  --surface:        var(--white);\n  --surface-muted:  var(--ink-50);\n  --surface-mint:   var(--mint-100);\n  --surface-ink:    var(--ink-900);\n  --surface-inset:  var(--ink-100);\n\n  /* Text */\n  --text-strong:    var(--ink-900);\n  --text-body:      var(--ink-800);\n  --text-muted:     var(--ink-600);\n  --text-subtle:    var(--ink-500);\n  --text-on-brand:  var(--ink-900);  /* gold is light → dark text */\n  --text-on-ink:    var(--mint-50);\n  --text-inverse:   var(--white);\n\n  /* Brand roles */\n  --brand:          var(--gold-500);\n  --brand-hover:    var(--gold-400);\n  --brand-press:    var(--gold-600);\n  --brand-strong:   var(--gold-700);\n  --brand-subtle:   var(--gold-100);\n  --accent:         var(--olive-500);\n  --accent-strong:  var(--olive-700);\n\n  /* Borders & lines */\n  --border-subtle:  var(--ink-200);\n  --border-default: var(--ink-300);\n  --border-strong:  var(--ink-400);\n  --border-brand:   var(--gold-500);\n  --border-onink:   rgba(238, 255, 219, 0.14);\n\n  /* Focus ring */\n  --focus-ring:     var(--gold-500);\n  --focus-ring-offset: var(--white);\n\n  /* Selection */\n  --select-bg:      var(--gold-200);\n  --select-fg:      var(--ink-900);\n}\n\n::selection { background: var(--select-bg); color: var(--select-fg); }\n\n/* ============================================================\n   Searchify — Typography tokens\n   Display: Bricolage Grotesque · Body: Hanken Grotesk · Mono: JetBrains Mono\n   Type scale is a major-third-ish ramp tuned for marketing + product.\n   ============================================================ */\n\n:root {\n  /* ---- Families ---- */\n  --font-display: 'Bricolage Grotesque', 'Hanken Grotesk', system-ui, sans-serif;\n  --font-sans:    'Hanken Grotesk', system-ui, -apple-system, sans-serif;\n  --font-mono:    'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;\n\n  /* ---- Weights ---- */\n  --fw-regular:  400; /* @kind font */\n  --fw-medium:   500; /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold:     700; /* @kind font */\n  --fw-extra:    800; /* @kind font */\n\n  /* ---- Font sizes (rem-based, 16px root) ---- */\n  --text-2xs:  0.6875rem;  /* 11px */\n  --text-xs:   0.75rem;    /* 12px */\n  --text-sm:   0.875rem;   /* 14px */\n  --text-base: 1rem;       /* 16px */\n  --text-md:   1.125rem;   /* 18px */\n  --text-lg:   1.375rem;   /* 22px */\n  --text-xl:   1.75rem;    /* 28px */\n  --text-2xl:  2.25rem;    /* 36px */\n  --text-3xl:  3rem;       /* 48px */\n  --text-4xl:  4rem;       /* 64px */\n  --text-5xl:  5.25rem;    /* 84px */\n\n  /* ---- Line heights ---- */\n  --leading-tight:   1.04;\n  --leading-snug:    1.16;\n  --leading-normal:  1.5;\n  --leading-relaxed: 1.65;\n\n  /* ---- Letter spacing ---- */\n  --tracking-tight:  -0.03em;\n  --tracking-snug:   -0.015em;\n  --tracking-normal: 0;\n  --tracking-wide:   0.04em;\n  --tracking-caps:   0.12em;  /* eyebrow / overline */\n\n  /* ---- Semantic roles ---- */\n  --display-font:    var(--font-display);\n  --display-weight:  var(--fw-extra);\n  --display-tracking: var(--tracking-tight);\n\n  --heading-font:    var(--font-display);\n  --heading-weight:  var(--fw-bold);\n\n  --body-font:       var(--font-sans);\n  --body-weight:     var(--fw-regular);\n  --body-leading:    var(--leading-relaxed);\n\n  --eyebrow-font:    var(--font-mono);\n  --eyebrow-weight:  var(--fw-medium);\n  --eyebrow-size:    var(--text-xs);\n  --eyebrow-tracking: var(--tracking-caps);\n}\n\n/* Convenience utility classes (optional; tokens are the source of truth) */\n.ds-display {\n  font-family: var(--display-font);\n  font-weight: var(--display-weight);\n  letter-spacing: var(--display-tracking);\n  line-height: var(--leading-tight);\n}\n.ds-eyebrow {\n  font-family: var(--eyebrow-font);\n  font-weight: var(--eyebrow-weight);\n  font-size: var(--eyebrow-size);\n  letter-spacing: var(--eyebrow-tracking);\n  text-transform: uppercase;\n}\n\n/* ============================================================\n   Searchify — Spacing & layout tokens\n   8px base grid with a couple of half-steps for fine control.\n   ============================================================ */\n\n:root {\n  /* ---- Spacing scale (8px grid) ---- */\n  --space-0:   0;\n  --space-1:   0.25rem;  /* 4 */\n  --space-2:   0.5rem;   /* 8 */\n  --space-3:   0.75rem;  /* 12 */\n  --space-4:   1rem;     /* 16 */\n  --space-5:   1.5rem;   /* 24 */\n  --space-6:   2rem;     /* 32 */\n  --space-7:   3rem;     /* 48 */\n  --space-8:   4rem;     /* 64 */\n  --space-9:   6rem;     /* 96 */\n  --space-10:  8rem;     /* 128 */\n\n  /* ---- Container widths ---- */\n  --container-sm:  640px;\n  --container-md:  840px;\n  --container-lg:  1080px;\n  --container-xl:  1280px;\n  --container-2xl: 1440px;\n\n  /* ---- Section rhythm ---- */\n  --section-pad-y:    var(--space-9);\n  --gutter:           var(--space-5);\n}\n\n/* ============================================================\n   Searchify — Effects: radii, shadows, borders, motion\n   Soft, slightly oversized radii + warm-tinted shadows.\n   ============================================================ */\n\n:root {\n  /* ---- Corner radii ---- */\n  --radius-xs:   4px;\n  --radius-sm:   8px;\n  --radius-md:   12px;\n  --radius-lg:   18px;\n  --radius-xl:   26px;\n  --radius-2xl:  36px;\n  --radius-pill: 999px;\n\n  /* ---- Border widths ---- */\n  --border-1: 1px; /* @kind other */\n  --border-2: 2px; /* @kind other */\n\n  /* ---- Shadows: warm-tinted, soft, layered ---- */\n  --shadow-xs:  0 1px 2px rgba(22, 23, 15, 0.06);\n  --shadow-sm:  0 2px 6px rgba(22, 23, 15, 0.07);\n  --shadow-md:  0 8px 24px -8px rgba(22, 23, 15, 0.14);\n  --shadow-lg:  0 20px 48px -16px rgba(22, 23, 15, 0.20);\n  --shadow-xl:  0 36px 80px -28px rgba(22, 23, 15, 0.28);\n\n  /* Gold-tinted glow for hero/brand emphasis */\n  --shadow-brand: 0 18px 48px -16px rgba(206, 170, 40, 0.45);\n\n  /* Inset for inputs / wells */\n  --shadow-inset: inset 0 1px 2px rgba(22, 23, 15, 0.06);\n\n  /* ---- Motion ---- */\n  --ease-out:    cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */\n  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1); /* @kind other */\n  --dur-fast:   120ms; /* @kind other */\n  --dur-base:   220ms; /* @kind other */\n  --dur-slow:   420ms; /* @kind other */\n\n  /* ---- Z-index scale ---- */\n  --z-base:    0;    /* @kind other */\n  --z-raised:  10;   /* @kind other */\n  --z-sticky:  100;  /* @kind other */\n  --z-overlay: 1000; /* @kind other */\n  --z-toast:   1100; /* @kind other */\n}\n\n/* ============================================================\n   Searchify — Base element defaults\n   Applies tokens to raw elements so consumers get sane defaults.\n   ============================================================ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font-family: var(--body-font);\n  font-weight: var(--body-weight);\n  font-size: var(--text-base);\n  line-height: var(--body-leading);\n  color: var(--text-body);\n  background: var(--bg-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4, h5 {\n  font-family: var(--heading-font);\n  font-weight: var(--heading-weight);\n  color: var(--text-strong);\n  line-height: var(--leading-snug);\n  letter-spacing: var(--tracking-snug);\n  margin: 0 0 0.5em;\n  text-wrap: balance;\n}\n\nh1 { font-size: var(--text-3xl); letter-spacing: var(--tracking-tight); }\nh2 { font-size: var(--text-2xl); }\nh3 { font-size: var(--text-xl); }\nh4 { font-size: var(--text-lg); }\n\np { margin: 0 0 1em; text-wrap: pretty; }\n\na { color: var(--brand-strong); text-decoration: none; }\na:hover { text-decoration: underline; }\n\ncode, kbd, samp, pre {\n  font-family: var(--font-mono);\n  font-size: 0.92em;\n}\n\n:focus-visible {\n  outline: var(--border-2) solid var(--focus-ring);\n  outline-offset: 2px;\n}\n\nhr { border: none; border-top: var(--border-1) solid var(--border-subtle); margin: var(--space-6) 0; }\n\nimg, svg, video { display: block; max-width: 100%; }\n\n<\u002Fstyle>\n  <script src=\"b55760c3-bd8d-4990-8072-db4bbbbdee22\"><\u002Fscript>\n  <script src=\"4dd4f120-1508-4499-8248-8c650aa83f5f\"><\u002Fscript>\n  <style>\n    /* Retheme Searchify tokens to the warm family palette extracted from the hero image\n       (blush pink, carnation red, coral, leaf green, warm ink). */\n    :root {\n      --brand:        #D8443E;\n      --brand-hover:  #E86B5C;\n      --brand-press:  #B8342E;\n      --brand-strong: #9A2E28;\n      --brand-subtle: #FBE0DB;\n      --text-on-brand:#FFFFFF;\n\n      --accent:        #4E8F5B;\n      --accent-strong: #33693F;\n\n      --gold-50:  #FEF4F1;\n      --gold-100: #FBE0DB;\n      --gold-300: #F0A79B;\n      --gold-800: #9A2E28;\n\n      --olive-100: #DDEAD3;\n      --olive-700: #33693F;\n\n      --mint-50:  #FEF7F4;\n      --mint-100: #FBEAE6;\n\n      --ink-900: #2A1C19;\n      --ink-800: #3A2925;\n\n      --surface-mint: #FBEAE6;\n      --surface-ink:  #2A1C19;\n      --bg-page:      #FEF7F4;\n      --text-on-ink:  #FCEFEA;\n\n      --shadow-brand: 0 18px 48px -16px rgba(216, 68, 62, 0.42);\n    }\n    html, body { margin: 0; background: var(--bg-page); }\n    body {\n      font-family: var(--font-sans);\n      color: var(--ink-800);\n      -webkit-font-smoothing: antialiased;\n      text-rendering: optimizeLegibility;\n    }\n    a { color: var(--brand-strong); text-decoration: none; }\n    a:hover { color: var(--brand); text-decoration: underline; }\n    ::selection { background: #FBD5CE; color: #2A1C19; }\n    * { box-sizing: border-box; }\n    [data-lucide] { display: inline-block; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background: var(--bg-page); overflow-x: hidden;\">\n\n  <!-- ===================== NAV ===================== -->\n  <header style=\"position: sticky; top: 0; z-index: 100; background: rgba(254,247,244,0.82); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(42,28,25,0.08);\">\n    <nav style=\"max-width: 1200px; margin: 0 auto; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; gap: 24px;\">\n      <a href=\"#top\" style=\"display: flex; align-items: center; gap: 10px; color: var(--ink-900);\">\n        <span style=\"width: 34px; height: 34px; border-radius: 12px; background: var(--brand); color: #fff; display: inline-flex; align-items: center; justify-content: center;\"><i data-lucide=\"heart\" style=\"width: 18px; height: 18px;\"><\u002Fi><\u002Fspan>\n        <span style=\"font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -0.02em;\">Viet<span style=\"color: var(--brand);\">Family<\u002Fspan><\u002Fspan>\n      <\u002Fa>\n      <div style=\"display: flex; align-items: center; gap: 28px; font-size: 15px; font-weight: 500;\" data-nav-links=\"\">\n        <a href=\"#khai-niem\" style=\"color: var(--ink-700);\">Khái niệm<\u002Fa>\n        <a href=\"#vi-tri\" style=\"color: var(--ink-700);\">Vị trí<\u002Fa>\n        <a href=\"#chuc-nang\" style=\"color: var(--ink-700);\">Chức năng<\u002Fa>\n        <a href=\"#co-so\" style=\"color: var(--ink-700);\">Cơ sở xây dựng<\u002Fa>\n        <a href=\"#hien-nay\" style=\"color: var(--ink-700);\">Hiện nay<\u002Fa>\n      <\u002Fdiv>\n      <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Button\" as=\"a\" href=\"#chuc-nang\" size=\"sm\" hint-size=\"auto,36px\">Khám phá<\u002Fx-import>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <!-- ===================== HERO ===================== -->\n  <section id=\"top\" style=\"position: relative; background: linear-gradient(180deg, #FBEAE6 0%, #FEF7F4 100%);\">\n    <div style=\"max-width: 1200px; margin: 0 auto; padding: 84px 32px 96px; display: grid; grid-template-columns: 1.05fr 1fr; gap: 56px; align-items: center;\">\n      <div>\n        <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Eyebrow\" tone=\"brand\" hint-size=\"auto,18px\">Chương 7 · Chủ nghĩa xã hội khoa học<\u002Fx-import>\n        <h1 style=\"font-family: var(--font-display); font-weight: 800; letter-spacing: -0.03em; line-height: 1.02; font-size: clamp(40px, 5.2vw, 68px); color: var(--ink-900); margin: 18px 0 0; text-wrap: balance;\">Gia đình — tế bào lành mạnh của xã hội<\u002Fh1>\n        <p style=\"font-size: 19px; line-height: 1.65; color: var(--ink-700); margin: 22px 0 0; max-width: 34em; text-wrap: pretty;\">Gia đình là một cộng đồng người đặc biệt, hình thành trên cơ sở hôn nhân, huyết thống và nuôi dưỡng. Là tổ ấm của mỗi người và là nền tảng cho sự tồn tại, phát triển của xã hội.<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px;\">\n          <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Button\" as=\"a\" href=\"#khai-niem\" size=\"lg\" hint-size=\"auto,52px\">Bắt đầu tìm hiểu<\u002Fx-import>\n          <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Button\" as=\"a\" href=\"#co-so\" variant=\"outline\" size=\"lg\" hint-size=\"auto,52px\">Cơ sở xây dựng<\u002Fx-import>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 10px; margin-top: 34px;\">\n          <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Badge\" tone=\"brand\" hint-size=\"auto,26px\">Hôn nhân<\u002Fx-import>\n          <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Badge\" tone=\"accent\" hint-size=\"auto,26px\">Huyết thống<\u002Fx-import>\n          <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Badge\" tone=\"mint\" hint-size=\"auto,26px\">Nuôi dưỡng<\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position: relative;\">\n        <div style=\"border-radius: 26px; overflow: hidden; box-shadow: 0 30px 70px -24px rgba(154,46,40,0.34); border: 6px solid #fff;\">\n          <img src=\"969fe005-c158-47c4-919f-cb258e14e66e\" alt=\"Minh hoạ gia đình Việt Nam nhiều thế hệ\" style=\"display: block; width: 100%; height: auto;\">\n        <\u002Fdiv>\n        <div style=\"position: absolute; left: -20px; bottom: -22px; background: #fff; border-radius: 18px; padding: 16px 20px; box-shadow: 0 16px 40px -14px rgba(42,28,25,0.24); display: flex; align-items: center; gap: 12px;\">\n          <span style=\"width: 40px; height: 40px; border-radius: 12px; background: var(--brand-subtle); color: var(--brand-strong); display: inline-flex; align-items: center; justify-content: center;\"><i data-lucide=\"home\" style=\"width: 20px; height: 20px;\"><\u002Fi><\u002Fspan>\n          <div>\n            <div style=\"font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--ink-900); line-height: 1.1;\">Tổ ấm<\u002Fdiv>\n            <div style=\"font-size: 13px; color: var(--ink-600);\">của mỗi con người<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== KHÁI NIỆM ===================== -->\n  <section id=\"khai-niem\" style=\"max-width: 1200px; margin: 0 auto; padding: 96px 32px;\">\n    <div style=\"max-width: 780px;\">\n      <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Eyebrow\" tone=\"brand\" hint-size=\"auto,18px\">01 — Khái niệm<\u002Fx-import>\n      <h2 style=\"font-family: var(--font-display); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; font-size: clamp(30px, 3.8vw, 46px); color: var(--ink-900); margin: 16px 0 0; text-wrap: balance;\">Gia đình là gì?<\u002Fh2>\n      <p style=\"font-size: 19px; line-height: 1.65; color: var(--ink-700); margin: 20px 0 0; text-wrap: pretty;\">Gia đình là một hình thức cộng đồng xã hội đặc biệt, được hình thành, duy trì và củng cố chủ yếu dựa trên cơ sở <strong style=\"color: var(--brand-strong);\">hôn nhân<\u002Fstrong>, <strong style=\"color: var(--brand-strong);\">quan hệ huyết thống<\u002Fstrong> và <strong style=\"color: var(--brand-strong);\">quan hệ nuôi dưỡng<\u002Fstrong>, cùng những quy định về quyền và nghĩa vụ của các thành viên.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 44px;\">\n      <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Card\" variant=\"flat\" hint-size=\"100%,220px\">\n        <span style=\"width: 46px; height: 46px; border-radius: 13px; background: var(--brand-subtle); color: var(--brand-strong); display: inline-flex; align-items: center; justify-content: center;\"><i data-lucide=\"gem\" style=\"width: 22px; height: 22px;\"><\u002Fi><\u002Fspan>\n        <h3 style=\"font-family: var(--font-display); font-weight: 700; font-size: 21px; color: var(--ink-900); margin: 16px 0 8px;\">Quan hệ hôn nhân<\u002Fh3>\n        <p style=\"font-size: 15.5px; line-height: 1.6; color: var(--ink-600); margin: 0;\">Cơ sở, nền tảng hình thành các mối quan hệ khác và là cơ sở pháp lý cho sự tồn tại của mỗi gia đình.<\u002Fp>\n      <\u002Fx-import>\n      <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Card\" variant=\"flat\" hint-size=\"100%,220px\">\n        <span style=\"width: 46px; height: 46px; border-radius: 13px; background: var(--olive-100); color: var(--accent-strong); display: inline-flex; align-items: center; justify-content: center;\"><i data-lucide=\"git-branch\" style=\"width: 22px; height: 22px;\"><\u002Fi><\u002Fspan>\n        <h3 style=\"font-family: var(--font-display); font-weight: 700; font-size: 21px; color: var(--ink-900); margin: 16px 0 8px;\">Quan hệ huyết thống<\u002Fh3>\n        <p style=\"font-size: 15.5px; line-height: 1.6; color: var(--ink-600); margin: 0;\">Quan hệ giữa những người cùng dòng máu, nảy sinh từ hôn nhân — yếu tố tự nhiên, mạnh mẽ nhất gắn kết các thành viên.<\u002Fp>\n      <\u002Fx-import>\n      <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Card\" variant=\"flat\" hint-size=\"100%,220px\">\n        <span style=\"width: 46px; height: 46px; border-radius: 13px; background: var(--brand-subtle); color: var(--brand-strong); display: inline-flex; align-items: center; justify-content: center;\"><i data-lucide=\"sprout\" style=\"width: 22px; height: 22px;\"><\u002Fi><\u002Fspan>\n        <h3 style=\"font-family: var(--font-display); font-weight: 700; font-size: 21px; color: var(--ink-900); margin: 16px 0 8px;\">Quan hệ nuôi dưỡng<\u002Fh3>\n        <p style=\"font-size: 15.5px; line-height: 1.6; color: var(--ink-600); margin: 0;\">Sự chăm sóc, nuôi dưỡng lẫn nhau về vật chất và tinh thần — vừa là trách nhiệm, vừa là quyền lợi thiêng liêng.<\u002Fp>\n      <\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== VỊ TRÍ ===================== -->\n  <section id=\"vi-tri\" style=\"background: var(--surface-mint);\">\n    <div style=\"max-width: 1200px; margin: 0 auto; padding: 96px 32px;\">\n      <div style=\"max-width: 780px;\">\n        <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Eyebrow\" tone=\"brand\" hint-size=\"auto,18px\">02 — Vị trí<\u002Fx-import>\n        <h2 style=\"font-family: var(--font-display); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; font-size: clamp(30px, 3.8vw, 46px); color: var(--ink-900); margin: 16px 0 0; text-wrap: balance;\">Vị trí của gia đình trong xã hội<\u002Fh2>\n        <p style=\"font-size: 19px; line-height: 1.65; color: var(--ink-700); margin: 20px 0 0; text-wrap: pretty;\">Gia đình giữ ba vai trò không thể thay thế: là tế bào của xã hội, là tổ ấm của mỗi người và là cầu nối giữa cá nhân với xã hội.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 44px;\">\n        <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Card\" variant=\"raised\" hint-size=\"100%,250px\">\n          <span style=\"font-family: var(--font-mono); font-size: 13px; color: var(--brand); letter-spacing: 0.1em;\">01<\u002Fspan>\n          <span style=\"display: block; width: 48px; height: 48px; border-radius: 14px; background: var(--brand); color: #fff; display: inline-flex; align-items: center; justify-content: center; margin-top: 8px;\"><i data-lucide=\"hexagon\" style=\"width: 23px; height: 23px;\"><\u002Fi><\u002Fspan>\n          <h3 style=\"font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--ink-900); margin: 16px 0 8px;\">Tế bào của xã hội<\u002Fh3>\n          <p style=\"font-size: 15.5px; line-height: 1.62; color: var(--ink-600); margin: 0;\">Không có gia đình tái tạo con người thì xã hội không thể tồn tại. Muốn xã hội phát triển lành mạnh phải xây dựng tế bào gia đình tốt.<\u002Fp>\n        <\u002Fx-import>\n        <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Card\" variant=\"raised\" hint-size=\"100%,250px\">\n          <span style=\"font-family: var(--font-mono); font-size: 13px; color: var(--brand); letter-spacing: 0.1em;\">02<\u002Fspan>\n          <span style=\"display: block; width: 48px; height: 48px; border-radius: 14px; background: var(--accent); color: #fff; display: inline-flex; align-items: center; justify-content: center; margin-top: 8px;\"><i data-lucide=\"house-plus\" style=\"width: 23px; height: 23px;\"><\u002Fi><\u002Fspan>\n          <h3 style=\"font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--ink-900); margin: 16px 0 8px;\">Tổ ấm hạnh phúc<\u002Fh3>\n          <p style=\"font-size: 15.5px; line-height: 1.62; color: var(--ink-600); margin: 0;\">Môi trường tốt nhất để mỗi cá nhân được yêu thương, nuôi dưỡng, trưởng thành và hình thành nhân cách, thể lực, trí lực.<\u002Fp>\n        <\u002Fx-import>\n        <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Card\" variant=\"raised\" hint-size=\"100%,250px\">\n          <span style=\"font-family: var(--font-mono); font-size: 13px; color: var(--brand); letter-spacing: 0.1em;\">03<\u002Fspan>\n          <span style=\"display: block; width: 48px; height: 48px; border-radius: 14px; background: var(--brand-strong); color: #fff; display: inline-flex; align-items: center; justify-content: center; margin-top: 8px;\"><i data-lucide=\"waypoints\" style=\"width: 23px; height: 23px;\"><\u002Fi><\u002Fspan>\n          <h3 style=\"font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--ink-900); margin: 16px 0 8px;\">Cầu nối cá nhân – xã hội<\u002Fh3>\n          <p style=\"font-size: 15.5px; line-height: 1.62; color: var(--ink-600); margin: 0;\">Cộng đồng xã hội đầu tiên mỗi cá nhân sinh sống; nơi đầu tiên con người học được và thực hiện các quan hệ xã hội.<\u002Fp>\n        <\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== QUOTE STRIP ===================== -->\n  <sc-if value=\"{{ showQuotes }}\" hint-placeholder-val=\"{{ true }}\">\n  <section style=\"background: var(--surface-ink);\">\n    <div style=\"max-width: 900px; margin: 0 auto; padding: 84px 32px; text-align: center;\">\n      <i data-lucide=\"quote\" style=\"width: 40px; height: 40px; color: var(--brand-hover);\"><\u002Fi>\n      <blockquote style=\"font-family: var(--font-display); font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; font-size: clamp(24px, 3.2vw, 38px); color: var(--text-on-ink); margin: 22px 0 0; text-wrap: balance;\">“Nhiều gia đình cộng lại mới thành xã hội, xã hội tốt thì gia đình càng tốt, gia đình tốt thì xã hội mới tốt. Hạt nhân của xã hội chính là gia đình.”<\u002Fblockquote>\n      <div style=\"font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-300); margin-top: 26px;\">— Chủ tịch Hồ Chí Minh<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ===================== CHỨC NĂNG ===================== -->\n  <section id=\"chuc-nang\" style=\"max-width: 1200px; margin: 0 auto; padding: 96px 32px;\">\n    <div style=\"max-width: 780px;\">\n      <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Eyebrow\" tone=\"brand\" hint-size=\"auto,18px\">03 — Chức năng<\u002Fx-import>\n      <h2 style=\"font-family: var(--font-display); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; font-size: clamp(30px, 3.8vw, 46px); color: var(--ink-900); margin: 16px 0 0; text-wrap: balance;\">Bốn chức năng cơ bản<\u002Fh2>\n      <p style=\"font-size: 19px; line-height: 1.65; color: var(--ink-700); margin: 20px 0 0; text-wrap: pretty;\">Gia đình thực hiện những chức năng riêng có mà không cộng đồng nào thay thế được.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 44px;\">\n      <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Card\" variant=\"flat\" hint-size=\"100%,180px\">\n        <div style=\"display: flex; gap: 18px; align-items: flex-start;\">\n          <span style=\"flex: none; width: 52px; height: 52px; border-radius: 15px; background: var(--brand-subtle); color: var(--brand-strong); display: inline-flex; align-items: center; justify-content: center;\"><i data-lucide=\"baby\" style=\"width: 26px; height: 26px;\"><\u002Fi><\u002Fspan>\n          <div>\n            <h3 style=\"font-family: var(--font-display); font-weight: 700; font-size: 21px; color: var(--ink-900); margin: 2px 0 8px;\">Tái sản xuất ra con người<\u002Fh3>\n            <p style=\"font-size: 15.5px; line-height: 1.6; color: var(--ink-600); margin: 0;\">Chức năng đặc thù, đáp ứng nhu cầu duy trì nòi giống và cung cấp nguồn lao động, duy trì sự trường tồn của xã hội.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fx-import>\n      <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Card\" variant=\"flat\" hint-size=\"100%,180px\">\n        <div style=\"display: flex; gap: 18px; align-items: flex-start;\">\n          <span style=\"flex: none; width: 52px; height: 52px; border-radius: 15px; background: var(--olive-100); color: var(--accent-strong); display: inline-flex; align-items: center; justify-content: center;\"><i data-lucide=\"graduation-cap\" style=\"width: 26px; height: 26px;\"><\u002Fi><\u002Fspan>\n          <div>\n            <h3 style=\"font-family: var(--font-display); font-weight: 700; font-size: 21px; color: var(--ink-900); margin: 2px 0 8px;\">Nuôi dưỡng, giáo dục<\u002Fh3>\n            <p style=\"font-size: 15.5px; line-height: 1.6; color: var(--ink-600); margin: 0;\">Nuôi dạy con cái thành người có ích; đặt nền móng đầu tiên cho nhân cách, đạo đức và lối sống của mỗi người.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fx-import>\n      <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Card\" variant=\"flat\" hint-size=\"100%,180px\">\n        <div style=\"display: flex; gap: 18px; align-items: flex-start;\">\n          <span style=\"flex: none; width: 52px; height: 52px; border-radius: 15px; background: var(--brand-subtle); color: var(--brand-strong); display: inline-flex; align-items: center; justify-content: center;\"><i data-lucide=\"wallet\" style=\"width: 26px; height: 26px;\"><\u002Fi><\u002Fspan>\n          <div>\n            <h3 style=\"font-family: var(--font-display); font-weight: 700; font-size: 21px; color: var(--ink-900); margin: 2px 0 8px;\">Kinh tế và tổ chức tiêu dùng<\u002Fh3>\n            <p style=\"font-size: 15.5px; line-height: 1.6; color: var(--ink-600); margin: 0;\">Tham gia sản xuất và là đơn vị tiêu dùng của xã hội; đảm bảo đời sống vật chất và tinh thần của các thành viên.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fx-import>\n      <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Card\" variant=\"flat\" hint-size=\"100%,180px\">\n        <div style=\"display: flex; gap: 18px; align-items: flex-start;\">\n          <span style=\"flex: none; width: 52px; height: 52px; border-radius: 15px; background: var(--olive-100); color: var(--accent-strong); display: inline-flex; align-items: center; justify-content: center;\"><i data-lucide=\"heart-pulse\" style=\"width: 26px; height: 26px;\"><\u002Fi><\u002Fspan>\n          <div>\n            <h3 style=\"font-family: var(--font-display); font-weight: 700; font-size: 21px; color: var(--ink-900); margin: 2px 0 8px;\">Thoả mãn tâm sinh lý, tình cảm<\u002Fh3>\n            <p style=\"font-size: 15.5px; line-height: 1.6; color: var(--ink-600); margin: 0;\">Chỗ dựa tình cảm, chăm sóc sức khỏe người già, trẻ em; giữ sự cân bằng tâm lý và ổn định của xã hội.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fx-import>\n    <\u002Fdiv>\n    <p style=\"font-size: 15px; color: var(--ink-500); margin: 24px 0 0; display: flex; align-items: center; gap: 8px;\"><i data-lucide=\"info\" style=\"width: 17px; height: 17px;\"><\u002Fi> Ngoài ra, gia đình còn đảm nhận chức năng văn hóa và chức năng chính trị.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- ===================== CƠ SỞ XÂY DỰNG ===================== -->\n  <section id=\"co-so\" style=\"background: var(--surface-mint);\">\n    <div style=\"max-width: 1200px; margin: 0 auto; padding: 96px 32px;\">\n      <div style=\"max-width: 820px;\">\n        <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Eyebrow\" tone=\"brand\" hint-size=\"auto,18px\">04 — Cơ sở xây dựng<\u002Fx-import>\n        <h2 style=\"font-family: var(--font-display); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; font-size: clamp(30px, 3.8vw, 46px); color: var(--ink-900); margin: 16px 0 0; text-wrap: balance;\">Cơ sở xây dựng gia đình trong thời kỳ quá độ lên CNXH<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 44px;\">\n        <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Card\" variant=\"flat\" hint-size=\"100%,210px\">\n          <span style=\"width: 44px; height: 44px; border-radius: 13px; background: var(--brand-subtle); color: var(--brand-strong); display: inline-flex; align-items: center; justify-content: center;\"><i data-lucide=\"trending-up\" style=\"width: 21px; height: 21px;\"><\u002Fi><\u002Fspan>\n          <h3 style=\"font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--ink-900); margin: 14px 0 7px;\">Kinh tế – xã hội<\u002Fh3>\n          <p style=\"font-size: 14.5px; line-height: 1.55; color: var(--ink-600); margin: 0;\">Chế độ sở hữu XHCN thay thế sở hữu tư nhân, tạo cơ sở cho bình đẳng và giải phóng phụ nữ.<\u002Fp>\n        <\u002Fx-import>\n        <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Card\" variant=\"flat\" hint-size=\"100%,210px\">\n          <span style=\"width: 44px; height: 44px; border-radius: 13px; background: var(--olive-100); color: var(--accent-strong); display: inline-flex; align-items: center; justify-content: center;\"><i data-lucide=\"landmark\" style=\"width: 21px; height: 21px;\"><\u002Fi><\u002Fspan>\n          <h3 style=\"font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--ink-900); margin: 14px 0 7px;\">Chính trị – xã hội<\u002Fh3>\n          <p style=\"font-size: 14.5px; line-height: 1.55; color: var(--ink-600); margin: 0;\">Nhà nước XHCN cùng hệ thống pháp luật, chính sách bảo đảm quyền lợi và bình đẳng giới.<\u002Fp>\n        <\u002Fx-import>\n        <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Card\" variant=\"flat\" hint-size=\"100%,210px\">\n          <span style=\"width: 44px; height: 44px; border-radius: 13px; background: var(--brand-subtle); color: var(--brand-strong); display: inline-flex; align-items: center; justify-content: center;\"><i data-lucide=\"book-open\" style=\"width: 21px; height: 21px;\"><\u002Fi><\u002Fspan>\n          <h3 style=\"font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--ink-900); margin: 14px 0 7px;\">Văn hóa<\u002Fh3>\n          <p style=\"font-size: 14.5px; line-height: 1.55; color: var(--ink-600); margin: 0;\">Giá trị, chuẩn mực mới cùng sự phát triển giáo dục, khoa học điều chỉnh các quan hệ gia đình.<\u002Fp>\n        <\u002Fx-import>\n        <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Card\" variant=\"flat\" hint-size=\"100%,210px\">\n          <span style=\"width: 44px; height: 44px; border-radius: 13px; background: var(--olive-100); color: var(--accent-strong); display: inline-flex; align-items: center; justify-content: center;\"><i data-lucide=\"heart-handshake\" style=\"width: 21px; height: 21px;\"><\u002Fi><\u002Fspan>\n          <h3 style=\"font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--ink-900); margin: 14px 0 7px;\">Hôn nhân tiến bộ<\u002Fh3>\n          <p style=\"font-size: 14.5px; line-height: 1.55; color: var(--ink-600); margin: 0;\">Hôn nhân dựa trên tình yêu, tự nguyện, bình đẳng và được pháp luật bảo đảm.<\u002Fp>\n        <\u002Fx-import>\n      <\u002Fdiv>\n\n      <div style=\"margin-top: 56px;\">\n        <h3 style=\"font-family: var(--font-display); font-weight: 800; font-size: 26px; color: var(--ink-900); margin: 0 0 24px;\">Chế độ hôn nhân tiến bộ<\u002Fh3>\n        <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;\">\n          <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Card\" variant=\"ink\" hint-size=\"100%,200px\">\n            <span style=\"width: 46px; height: 46px; border-radius: 13px; background: rgba(232,107,92,0.22); color: var(--brand-hover); display: inline-flex; align-items: center; justify-content: center;\"><i data-lucide=\"hand-heart\" style=\"width: 22px; height: 22px;\"><\u002Fi><\u002Fspan>\n            <h4 style=\"font-family: var(--font-display); font-weight: 700; font-size: 19px; color: var(--text-on-ink); margin: 15px 0 8px;\">Hôn nhân tự nguyện<\u002Fh4>\n            <p style=\"font-size: 15px; line-height: 1.6; color: rgba(252,239,234,0.78); margin: 0;\">Xuất phát từ tình yêu; nam nữ tự do lựa chọn, bao hàm cả quyền tự do ly hôn chính đáng.<\u002Fp>\n          <\u002Fx-import>\n          <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Card\" variant=\"ink\" hint-size=\"100%,200px\">\n            <span style=\"width: 46px; height: 46px; border-radius: 13px; background: rgba(232,107,92,0.22); color: var(--brand-hover); display: inline-flex; align-items: center; justify-content: center;\"><i data-lucide=\"scale\" style=\"width: 22px; height: 22px;\"><\u002Fi><\u002Fspan>\n            <h4 style=\"font-family: var(--font-display); font-weight: 700; font-size: 19px; color: var(--text-on-ink); margin: 15px 0 8px;\">Một vợ một chồng, bình đẳng<\u002Fh4>\n            <p style=\"font-size: 15px; line-height: 1.6; color: rgba(252,239,234,0.78); margin: 0;\">Vợ và chồng có quyền lợi và nghĩa vụ ngang nhau trong mọi vấn đề của cuộc sống gia đình.<\u002Fp>\n          <\u002Fx-import>\n          <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Card\" variant=\"ink\" hint-size=\"100%,200px\">\n            <span style=\"width: 46px; height: 46px; border-radius: 13px; background: rgba(232,107,92,0.22); color: var(--brand-hover); display: inline-flex; align-items: center; justify-content: center;\"><i data-lucide=\"file-check-2\" style=\"width: 22px; height: 22px;\"><\u002Fi><\u002Fspan>\n            <h4 style=\"font-family: var(--font-display); font-weight: 700; font-size: 19px; color: var(--text-on-ink); margin: 15px 0 8px;\">Đảm bảo về pháp lý<\u002Fh4>\n            <p style=\"font-size: 15px; line-height: 1.6; color: rgba(252,239,234,0.78); margin: 0;\">Đăng ký kết hôn thể hiện trách nhiệm, được xã hội thừa nhận và bảo vệ hạnh phúc gia đình.<\u002Fp>\n          <\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== HIỆN NAY ===================== -->\n  <section id=\"hien-nay\" style=\"max-width: 1200px; margin: 0 auto; padding: 96px 32px;\">\n    <div style=\"max-width: 820px;\">\n      <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Eyebrow\" tone=\"brand\" hint-size=\"auto,18px\">05 — Gia đình Việt Nam hiện nay<\u002Fx-import>\n      <h2 style=\"font-family: var(--font-display); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; font-size: clamp(30px, 3.8vw, 46px); color: var(--ink-900); margin: 16px 0 0; text-wrap: balance;\">Sự biến đổi &amp; phương hướng xây dựng<\u002Fh2>\n    <\u002Fdiv>\n\n    <h3 style=\"font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--brand-strong); margin: 40px 0 18px;\">Những biến đổi chính<\u002Fh3>\n    <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;\">\n      <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Card\" variant=\"flat\" hint-size=\"100%,190px\">\n        <span style=\"width: 44px; height: 44px; border-radius: 13px; background: var(--brand-subtle); color: var(--brand-strong); display: inline-flex; align-items: center; justify-content: center;\"><i data-lucide=\"users\" style=\"width: 21px; height: 21px;\"><\u002Fi><\u002Fspan>\n        <h4 style=\"font-family: var(--font-display); font-weight: 700; font-size: 19px; color: var(--ink-900); margin: 14px 0 8px;\">Quy mô &amp; kết cấu<\u002Fh4>\n        <p style=\"font-size: 15px; line-height: 1.6; color: var(--ink-600); margin: 0;\">Chuyển sang gia đình hạt nhân, quy mô thu nhỏ, thường chỉ còn hai thế hệ cùng chung sống.<\u002Fp>\n      <\u002Fx-import>\n      <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Card\" variant=\"flat\" hint-size=\"100%,190px\">\n        <span style=\"width: 44px; height: 44px; border-radius: 13px; background: var(--olive-100); color: var(--accent-strong); display: inline-flex; align-items: center; justify-content: center;\"><i data-lucide=\"repeat\" style=\"width: 21px; height: 21px;\"><\u002Fi><\u002Fspan>\n        <h4 style=\"font-family: var(--font-display); font-weight: 700; font-size: 19px; color: var(--ink-900); margin: 14px 0 8px;\">Các chức năng<\u002Fh4>\n        <p style=\"font-size: 15px; line-height: 1.6; color: var(--ink-600); margin: 0;\">Xu hướng sinh đủ hai con, đầu tư cho giáo dục tăng, gia đình thiên về đơn vị tình cảm.<\u002Fp>\n      <\u002Fx-import>\n      <x-import component-from-global-scope=\"SearchifyDesignSystem_d2707b.Card\" variant=\"flat\" hint-size=\"100%,190px\">\n        <span style=\"width: 44px; height: 44px; border-radius: 13px; background: var(--brand-subtle); color: var(--brand-strong); display: inline-flex; align-items: center; justify-content: center;\"><i data-lucide=\"heart-crack\" style=\"width: 21px; height: 21px;\"><\u002Fi><\u002Fspan>\n        <h4 style=\"font-family: var(--font-display); font-weight: 700; font-size: 19px; color: var(--ink-900); margin: 14px 0 8px;\">Quan hệ gia đình<\u002Fh4>\n        <p style=\"font-size: 15px; line-height: 1.6; color: var(--ink-600); margin: 0;\">Bình đẳng hơn giữa vợ chồng, song đối mặt với ly hôn, mâu thuẫn thế hệ và tình cảm lỏng lẻo.<\u002Fp>\n      <\u002Fx-import>\n    <\u002Fdiv>\n\n    <h3 style=\"font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--brand-strong); margin: 48px 0 18px;\">Phương hướng xây dựng<\u002Fh3>\n    <div style=\"display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;\">\n      <div style=\"display: flex; gap: 16px; align-items: flex-start; background: #fff; border: 1px solid var(--border-subtle); border-radius: 16px; padding: 22px;\">\n        <span style=\"flex: none; font-family: var(--font-mono); font-size: 15px; font-weight: 600; width: 38px; height: 38px; border-radius: 11px; background: var(--brand); color: #fff; display: inline-flex; align-items: center; justify-content: center;\">01<\u002Fspan>\n        <p style=\"margin: 6px 0 0; font-size: 16px; line-height: 1.55; color: var(--ink-800);\"><strong style=\"color: var(--ink-900);\">Tăng cường sự lãnh đạo của Đảng<\u002Fstrong>, nâng cao nhận thức của xã hội về xây dựng và phát triển gia đình.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 16px; align-items: flex-start; background: #fff; border: 1px solid var(--border-subtle); border-radius: 16px; padding: 22px;\">\n        <span style=\"flex: none; font-family: var(--font-mono); font-size: 15px; font-weight: 600; width: 38px; height: 38px; border-radius: 11px; background: var(--accent); color: #fff; display: inline-flex; align-items: center; justify-content: center;\">02<\u002Fspan>\n        <p style=\"margin: 6px 0 0; font-size: 16px; line-height: 1.55; color: var(--ink-800);\"><strong style=\"color: var(--ink-900);\">Phát triển kinh tế – xã hội<\u002Fstrong>, nâng cao đời sống vật chất và kinh tế hộ gia đình.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 16px; align-items: flex-start; background: #fff; border: 1px solid var(--border-subtle); border-radius: 16px; padding: 22px;\">\n        <span style=\"flex: none; font-family: var(--font-mono); font-size: 15px; font-weight: 600; width: 38px; height: 38px; border-radius: 11px; background: var(--brand-strong); color: #fff; display: inline-flex; align-items: center; justify-content: center;\">03<\u002Fspan>\n        <p style=\"margin: 6px 0 0; font-size: 16px; line-height: 1.55; color: var(--ink-800);\"><strong style=\"color: var(--ink-900);\">Kế thừa giá trị truyền thống<\u002Fstrong>, đồng thời tiếp thu những tiến bộ của nhân loại về gia đình.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 16px; align-items: flex-start; background: #fff; border: 1px solid var(--border-subtle); border-radius: 16px; padding: 22px;\">\n        <span style=\"flex: none; font-family: var(--font-mono); font-size: 15px; font-weight: 600; width: 38px; height: 38px; border-radius: 11px; background: var(--accent-strong); color: #fff; display: inline-flex; align-items: center; justify-content: center;\">04<\u002Fspan>\n        <p style=\"margin: 6px 0 0; font-size: 16px; line-height: 1.55; color: var(--ink-800);\"><strong style=\"color: var(--ink-900);\">Nâng cao chất lượng<\u002Fstrong> phong trào xây dựng gia đình văn hóa.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== FOOTER ===================== -->\n  <footer style=\"background: var(--surface-ink); color: var(--text-on-ink);\">\n    <div style=\"max-width: 1200px; margin: 0 auto; padding: 56px 32px; display: flex; flex-wrap: wrap; gap: 24px; align-items: center; justify-content: space-between;\">\n      <div style=\"display: flex; align-items: center; gap: 10px;\">\n        <span style=\"width: 34px; height: 34px; border-radius: 12px; background: var(--brand); color: #fff; display: inline-flex; align-items: center; justify-content: center;\"><i data-lucide=\"heart\" style=\"width: 18px; height: 18px;\"><\u002Fi><\u002Fspan>\n        <span style=\"font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -0.02em; color: var(--text-on-ink);\">Viet<span style=\"color: var(--brand-hover);\">Family<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: rgba(252,239,234,0.65); max-width: 46em;\">Tóm tắt Chương 7 — Vấn đề gia đình trong thời kỳ quá độ lên chủ nghĩa xã hội. Trang có tính chất học tập, tổng hợp những nội dung chính.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  \n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 1200, &quot;height&quot;: 900}, &quot;accent&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#D8443E&quot;, &quot;options&quot;: [&quot;#D8443E&quot;, &quot;#E86B5C&quot;, &quot;#4E8F5B&quot;, &quot;#CEAA28&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Giao diện&quot;}, &quot;showQuotes&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Nội dung&quot;}}\">\nclass Component extends DCLogic {\n  applyTheme() {\n    if (typeof document === 'undefined') return;\n    const root = document.documentElement;\n    const PALETTES = {\n      '#D8443E': { brand: '#D8443E', hover: '#E86B5C', press: '#B8342E', strong: '#9A2E28', subtle: '#FBE0DB' },\n      '#E86B5C': { brand: '#E86B5C', hover: '#F08D7C', press: '#D2523F', strong: '#B03E2E', subtle: '#FCE4DE' },\n      '#4E8F5B': { brand: '#4E8F5B', hover: '#66A972', press: '#3B7147', strong: '#33693F', subtle: '#DCEAD3' },\n      '#CEAA28': { brand: '#CEAA28', hover: '#D6B539', press: '#AE8C1E', strong: '#876C17', subtle: '#F6EBBE' },\n    };\n    const accent = this.props.accent || '#D8443E';\n    const p = PALETTES[accent] || PALETTES['#D8443E'];\n    root.style.setProperty('--brand', p.brand);\n    root.style.setProperty('--brand-hover', p.hover);\n    root.style.setProperty('--brand-press', p.press);\n    root.style.setProperty('--brand-strong', p.strong);\n    root.style.setProperty('--brand-subtle', p.subtle);\n    root.style.setProperty('--gold-100', p.subtle);\n    root.style.setProperty('--gold-800', p.strong);\n    root.style.setProperty('--shadow-brand', '0 18px 48px -16px ' + p.hover + '73');\n  }\n  drawIcons() {\n    if (typeof window !== 'undefined' && window.lucide) {\n      try { window.lucide.createIcons(); } catch (e) {}\n    }\n  }\n  componentDidMount() {\n    this.applyTheme();\n    this.drawIcons();\n    // lucide may still be loading from CDN\n    this._t = setInterval(() => this.drawIcons(), 400);\n    setTimeout(() => { clearInterval(this._t); }, 4000);\n  }\n  componentDidUpdate() {\n    this.applyTheme();\n    this.drawIcons();\n  }\n  componentWillUnmount() {\n    if (this._t) clearInterval(this._t);\n  }\n  renderVals() {\n    return {\n      showQuotes: this.props.showQuotes ?? true,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
